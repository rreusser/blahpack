name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Unit tests: the node:test suite across every module.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # Lint: every project rule (lint/, one directory per rule) over every module,
  # including the spec ↔ code rules (signatures, validation prologue, messages,
  # JSDoc; exact, derived from spec/), plus each rule's own pass/fail fixture
  # tests and the escape-hatch guard. Hard gate — zero errors.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint rule fixture tests
        run: npm run test:lint-rules
      - name: No escape hatches (no continue-on-error, baselines, skips, disabled rules)
        run: npm run lint:escape-hatches
      - name: Run ESLint
        run: npm run test:lint
      - name: Per-rule corpus report is clean
        run: npm run lint:corpus

  # Conformance: the stdlib-conformance checks (file structure, scaffolding,
  # workspace ownership, naming, JSDoc, ...) beyond what lint/unit cover.
  # Hard gate, like every other job.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Specs in sync with the committed Fortran facts and overrides
        run: npm run spec:check
      - name: Run conformance checks (fast; structural)
        run: npm run conformance:fast
      - name: Run conformance checks (full; includes per-module ESLint)
        run: npm run conformance
      - name: Spec ↔ signature cross-check (all three forms)
        run: npm run spec:xcheck
      - name: Convention audit (bin/audit.sh)
        run: npm run audit
      - name: No stub wrapper files
        run: bash bin/check-stubs.sh
      - name: Module LEARNINGS files are filled in
        run: npm run lint:learnings
      # Tickets: format, plus coverage (CONVENTIONS P1): every check in bin/,
      # lint/ and package.json is gated here or tracked by an open ticket
      # (bin/checks.json), and every documented gap cites a ticket.
      - name: Validate problem tickets and ticket coverage
        run: npm run tickets:check

  # Generated files are in sync + the published package imports and runs.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: |
          node bin/gen-exports.js
          git diff --exit-code package.json index.js
      - name: Pack and import smoke test
        run: |
          npm pack
          TARBALL="$(ls -- *.tgz)"
          PKG_NAME="$(node -p "require('./package.json').name")"
          mkdir -p /tmp/pack-smoke
          cp "$TARBALL" /tmp/pack-smoke/
          cd /tmp/pack-smoke
          npm init -y > /dev/null
          npm install "./$TARBALL"
          PKG_NAME="$PKG_NAME" node -e "
            import(process.env.PKG_NAME).then((m) => {
              const n = Object.keys(m).length;
              if (n < 1000) throw new Error('expected >1000 exports, got ' + n);
              const x = new Float64Array([1, 2, 3]);
              const d = m.ddot(3, x, 1, x, 1);
              if (d !== 14) throw new Error('ddot smoke test failed: ' + d);
              console.log('pack smoke test OK:', n, 'exports');
            });
          "
