name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Unit tests: the node:test suite across every module.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Corpus-check driver tests (bin/lib)
        run: npm run test:tools

  # Lint: every project rule (lint/, one directory per rule) over every module,
  # including the spec ↔ code rules (signatures, validation prologue, messages,
  # JSDoc; exact, derived from spec/), plus each rule's own pass/fail fixture
  # tests and the escape-hatch guard. Hard gate — zero errors.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint rule fixture tests
        run: npm run test:lint-rules
      - name: No escape hatches (no continue-on-error, baselines, skips, disabled rules)
        run: npm run lint:escape-hatches
      - name: Run ESLint
        run: npm run test:lint
      - name: Type check (tsc over lib/, with stdlib's own type definitions)
        run: npm run typecheck
      - name: Type check callers (benchmarks and examples against lib/'s declared types; ticket 0094)
        run: npm run typecheck:callers
      - name: Per-rule corpus report is clean
        run: npm run lint:corpus

  # Conformance: the stdlib-conformance checks (file structure, scaffolding,
  # workspace ownership, naming, JSDoc, ...) beyond what lint/unit cover.
  # Hard gate, like every other job.
  # Early loop exits (CONVENTIONS X2; ticket 0045): for every module this PR
  # changes, the tests must tell whether code after each `break` should run.
  # Each surviving mutant needs a test or a proof in
  # test/break-mutants.equivalent.json; there is no tolerated-survivor list.
  mutants:
    name: Early-exit mutants (changed modules)
    runs-on: ubuntu-latest
    steps:
      # Full history: modules are selected by diff against the merge-base with
      # origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every early loop exit in a changed module is pinned by a test
        run: node bin/break-mutants.mjs --changed --check

  # Computed values (CONVENTIONS T4a; ticket 0093): coverage counts a line a
  # test runs whether or not it checks the result. For every base.js line this
  # PR adds or changes, each value mutant (a `± 1` dropped, a count one short,
  # `<`/`<=` or `>`/`>=` swapped, a branch statement deleted) must fail one of
  # the module's own tests, or be a proof in test/value-mutants.equivalent.json;
  # there is no tolerated-survivor list.
  value-mutants:
    name: Value mutants (changed base.js lines)
    runs-on: ubuntu-latest
    steps:
      # Full history: lines are selected by diff against the merge-base with
      # origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every changed base.js line is checked by a test, not only run
        run: npm run mutants:value

  # CONVENTIONS D5c (ticket 0060): a wrapper given WORK = null must allocate
  # enough. For every changed module, the module's own tests are rerun with
  # each null-allocated workspace forced to null and guarded by a sentinel
  # region; any write past the allocation fails the job.
  workspace:
    name: Workspace allocation (changed modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every WORK = null allocation in a changed wrapper is sufficient
        run: node bin/workspace-guard.mjs --changed --check

  # CONVENTIONS W6 (ticket 0103): a wrapper given WORK = null allocates the
  # reference's optimum (its LWORK = -1 query), not just the minimum. Every
  # row of the committed data/fortran-lwkopt.json is replayed through its
  # wrapper with every workspace null; an allocation below the optimum fails.
  # The cache is checked against the specs it was generated from.
  optimum:
    name: Workspace optimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The workspace-query cache matches the specs
        run: npm run lwkopt:check
      - name: Every WORK = null allocation reaches the reference's optimum
        run: npm run check:workspace-optimum

  # CONVENTIONS W3/W5 (ticket 0016): ndarray.js demands exactly the
  # reference's workspace minimum. Every row of the committed
  # data/fortran-lwmin.json (the smallest LWORK/LRWORK/LIWORK the reference
  # does not reject with INFO = -k, and each declared workspace extent) is
  # replayed through ndarray.js with base.js stopped: a RangeError at the
  # minimum, or reaching base.js at the minimum - 1, fails. The cache is
  # checked against the specs it was generated from.
  minimum:
    name: Workspace minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The workspace-minimum cache matches the specs
        run: npm run lwmin:check
      - name: Every ndarray.js workspace check demands the reference's minimum
        run: npm run check:workspace-minimum

  # CONVENTIONS T3/T4 (tickets 0033, 0064): every changed module's lib/ files
  # meet their per-file coverage floor under the module's own tests. The
  # wrapper and ndarray.js must be fully covered (both orders, the
  # WORK = null branch, every validation throw); base.js >= 90% lines and
  # >= 85% branches.
  coverage:
    name: Coverage (changed modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every lib/ file of a changed module meets its coverage floor
        run: node bin/coverage.mjs --changed --check --uncovered

  # Tickets 0065/0068: every valid ndarray.js call a changed module's tests
  # make is replayed through its <routine>.js wrapper (recorded workspaces:
  # bit-identical; WORK = null: same up to rounding), and every vector
  # length the wrapper assumes is checked against what the call touches and
  # against the spec.
  replay:
    name: Wrapper replay (changed modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every changed wrapper computes what its ndarray.js computes
        run: node bin/wrapper-replay.mjs --changed --check

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      # Full history: `tickets.js check` compares ticket ids with origin/main
      # and its merge-base (ticket 0050).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Specs in sync with the committed Fortran facts and overrides
        run: npm run spec:check
      - name: Run conformance checks (fast; structural)
        run: npm run conformance:fast
      - name: Run conformance checks (full; includes per-module ESLint)
        run: npm run conformance
      - name: Spec ↔ signature cross-check (all three forms)
        run: npm run spec:xcheck
      - name: Convention audit (bin/audit.sh)
        run: npm run audit
      - name: No stub wrapper files
        run: bash bin/check-stubs.sh
      - name: Module LEARNINGS files are filled in
        run: npm run lint:learnings
      # Tickets: format, plus coverage (CONVENTIONS P1): every check in bin/,
      # lint/ and package.json is gated here or tracked by an open ticket
      # (bin/checks.json), and every documented gap cites a ticket.
      - name: Validate problem tickets and ticket coverage
        run: npm run tickets:check

  # Benchmarks: every module benchmark (lib/*/base/*/benchmark/*.js) starts and
  # runs. Each file gets `timeout 3`; a throw, a `not ok` (e.g. the NaN check),
  # or a nonzero exit other than the timeout fails. Hard gate (ticket 0027).
  benchmarks:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every module benchmark runs (bin/bench-smoke.sh)
        run: bin/bench-smoke.sh

  # Every module example runs to completion (ticket 0041).
  examples:
    name: Examples smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every module example runs (bin/examples-smoke.sh)
        run: bin/examples-smoke.sh

  # Generated files are in sync + the published package imports and runs.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: |
          node bin/gen-exports.js
          git diff --exit-code package.json index.js
      - name: Pack and import smoke test
        run: |
          npm pack
          TARBALL="$(ls -- *.tgz)"
          PKG_NAME="$(node -p "require('./package.json').name")"
          mkdir -p /tmp/pack-smoke
          cp "$TARBALL" /tmp/pack-smoke/
          cd /tmp/pack-smoke
          npm init -y > /dev/null
          npm install "./$TARBALL"
          PKG_NAME="$PKG_NAME" node -e "
            import(process.env.PKG_NAME).then((m) => {
              const n = Object.keys(m).length;
              if (n < 1000) throw new Error('expected >1000 exports, got ' + n);
              const x = new Float64Array([1, 2, 3]);
              const d = m.ddot(3, x, 1, x, 1);
              if (d !== 14) throw new Error('ddot smoke test failed: ' + d);
              console.log('pack smoke test OK:', n, 'exports');
            });
          "
