name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Unit tests: the node:test suite across every module.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # Lint: every project rule (lint/, one directory per rule) over every module,
  # plus each rule's own pass/fail fixture tests, the escape-hatch guard, and
  # the exact strided-wrapper signature check. Hard gate — zero errors.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint rule fixture tests
        run: npm run test:lint-rules
      - name: No escape hatches (no continue-on-error, baselines, skips, disabled rules)
        run: npm run lint:escape-hatches
      - name: Run ESLint
        run: npm run test:lint
      - name: Strided wrapper signatures match the convention (CONVENTIONS.md D1-D3)
        run: npm run lint:conformance

  # Conformance: the stdlib-conformance checks (file structure, scaffolding,
  # workspace ownership, naming, JSDoc, ...) beyond what lint/unit cover.
  # Hard gate, like every other job.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run conformance checks (fast; structural)
        run: npm run conformance:fast

  # Generated files are in sync + the published package imports and runs.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: |
          node bin/gen-exports.js
          git diff --exit-code package.json index.js
      - name: Pack and import smoke test
        run: |
          npm pack
          TARBALL="$(ls -- *.tgz)"
          PKG_NAME="$(node -p "require('./package.json').name")"
          mkdir -p /tmp/pack-smoke
          cp "$TARBALL" /tmp/pack-smoke/
          cd /tmp/pack-smoke
          npm init -y > /dev/null
          npm install "./$TARBALL"
          PKG_NAME="$PKG_NAME" node -e "
            import(process.env.PKG_NAME).then((m) => {
              const n = Object.keys(m).length;
              if (n < 1000) throw new Error('expected >1000 exports, got ' + n);
              const x = new Float64Array([1, 2, 3]);
              const d = m.ddot(3, x, 1, x, 1);
              if (d !== 14) throw new Error('ddot smoke test failed: ' + d);
              console.log('pack smoke test OK:', n, 'exports');
            });
          "
